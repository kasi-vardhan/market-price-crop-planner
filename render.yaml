services:
  - type: web
    name: market-price-crop-planner
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
      - key: DATA_GOV_RESOURCE_URL
        value: https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070
      - key: ALLOWED_ORIGINS
        value: "*"
